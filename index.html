<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shadow Play</title>
    <meta name="description" content="A shadow-puppet show lit by one melting candle. Move the candle closer and your shadow grows huge, but the wax burns faster. The fire gives you shape. Time takes it away." />
    <meta name="theme-color" content="#061014" />

    <!-- The tab icon: a lit candle, drawn from the palette (ASSETS.md favicon). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />

    <!--
        Link preview (PRD 4.10 "page polish"): what shows when the game's link
        is shared. og-image.png is a real gameplay frame with the title.
        Some sites need the FULL deployed URL in og:image; once the Vercel
        address is known, put it in front of /og-image.png.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shadow Play" />
    <meta property="og:description" content="A shadow-puppet show lit by one melting candle. The fire gives you shape. Time takes it away." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/style.css">

    <!--
        SECURITY.md rule 7: NO third-party scripts, ever. No CDN, no analytics,
        no fonts linked from Google. Everything is bundled by Vite and served
        from our own domain, and the only script on the page is our own entry
        point below. It has no inline code, which is what keeps it legal under
        the Content-Security-Policy in SECURITY.md rule 10 (script-src 'self').

        The CSS loading screen from PRD 4.10 is still to do.
    -->
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
